if [ -z "$repo_root" ] && git rev-parse --show-toplevel >/dev/null 2>&1; then
  repo_root="$(git rev-parse --show-toplevel)"
fi

if [ -z "$repo_root" ]; then
  echo "Unable to determine the Codex workspace root for setup." >&2
