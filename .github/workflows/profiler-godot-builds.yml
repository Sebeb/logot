name: Profiler-enabled Godot builds

on:
  workflow_dispatch:
  push:
    paths:
      - "native/logot_profiler/**"
      - "scripts/build_profiler_godot.sh"
      - ".github/workflows/profiler-godot-builds.yml"

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install scons
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev yasm
      - name: Build profiler native tests
        env:
          LOGOT_BUILD_TESTS: "1"
        run: ./scripts/build_profiler_godot.sh linuxbsd editor x86_64
      - name: Run profiler native tests
        run: .build/godot/bin/godot.linuxbsd.editor.x86_64 --headless --test --test-case="*[LogotProfiler]*"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            arch: arm64
          - os: macos-13
            platform: macos
            arch: x86_64
          - os: windows-2022
            platform: windows
            arch: x86_64
          - os: ubuntu-24.04
            platform: linuxbsd
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SCons
        run: python -m pip install scons
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev yasm
      - name: Install rsync on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: choco install rsync -y
      - name: Build editor
        shell: bash
        run: ./scripts/build_profiler_godot.sh "${{ matrix.platform }}" editor "${{ matrix.arch }}"
      - name: Smoke-test profiler bridge
        shell: bash
        run: |
          editor_bin=$(find dist/${{ matrix.platform }}-${{ matrix.arch }}-editor -maxdepth 1 -type f -name '*editor*' | head -n 1)
          "$editor_bin" --headless --path . --script res://tests/profiler_bridge_smoke.gd
      - name: Build debug template
        shell: bash
        run: ./scripts/build_profiler_godot.sh "${{ matrix.platform }}" template_debug "${{ matrix.arch }}"
      - name: Smoke-test debug template
        shell: bash
        run: |
          template_bin=$(find dist/${{ matrix.platform }}-${{ matrix.arch }}-template_debug -maxdepth 1 -type f -name '*template_debug*' | head -n 1)
          "$template_bin" --headless --path . --script res://tests/profiler_bridge_smoke.gd
      - name: Upload versioned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7-logot-profiler-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/**
          if-no-files-found: error

  package-macos:
    needs: build
    runs-on: macos-14
    steps:
      - name: Download both macOS architectures
        uses: actions/download-artifact@v4
        with:
          pattern: godot-4.7-logot-profiler-macos-*
          path: godot-4.7-logot-profiler-macos
      - name: Upload combined macOS package
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7-logot-profiler-macos-universal-package
          path: godot-4.7-logot-profiler-macos/**
          if-no-files-found: error
